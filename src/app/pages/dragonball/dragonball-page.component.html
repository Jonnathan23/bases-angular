<h1 class="mt-4">Dragonball Page</h1>
<hr>

<section class="row">
    <div class="col-12 col-sm-6">
        <h3>Agregar:{{ name() }}</h3>
        <input type="text" class="form-control" placeholder="Name" [value]="name()" (change)="name.set(txtName.value)" #txtName>
        <input type="number" class="form-control mt-2" placeholder="Power" [value]="power()" (change)="power.set(+txtPower.value)"
            #txtPower>
        <button class="btn btn-primary mt-2" (click)="addCharacter()">Agregar</button>
    </div>+

    <div class="col-12 col-sm-6">
        <dragonball-character-list [characters]="characters()" />
       
    </div>
</section>
